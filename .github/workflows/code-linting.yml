name: Code Linting PHP CSS

on:
  pull_request:
    branches:
      - development

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, fileinfo, openssl, tokenizer, xml, ctype, json

      - name: PHP Syntax Check
        run: |
          find app routes database -name "*.php" -print0 | xargs -0 php -l

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Stylelint (local project)
        run: npm install stylelint stylelint-config-recommended --no-save

      - name: Run Stylelint
        run: |
          if find public -name "*.css" | grep -q .; then
            npx stylelint "public/**/*.css"
          else
            echo "No CSS files found"
          fi